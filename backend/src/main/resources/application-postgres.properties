# Activate with SPRING_PROFILES_ACTIVE=postgres
# RESCUE_DB_URL example: jdbc:postgresql://localhost:5432/rescue
spring.datasource.url=${RESCUE_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${RESCUE_DB_USER:rescue}
spring.datasource.password=${RESCUE_DB_PASSWORD:}
