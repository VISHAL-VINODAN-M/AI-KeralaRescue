spring.application.name=kerala-rescue-backend
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:./data/kerala-rescue;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always



spring.jackson.deserialization.fail-on-unknown-properties=false
# Shared secret for the responder dashboard/API (send as X-Responder-Key). Set via env var in real use.
rescue.responder-key=${RESCUE_RESPONDER_KEY:}

# ---- Live updates / security ---------------------------------------------------------------
# Trust the proxy's X-Forwarded-For so rate limits see the real client address (Render, nginx).
server.forward-headers-strategy=native
# Secret used to sign login tokens (16+ characters). Without it, sessions end whenever the server restarts.
rescue.jwt-secret=${RESCUE_JWT_SECRET:}
# Public address of this server, used in SMS links sent to helpers, e.g. https://kerala-rescue.onrender.com
rescue.public-url=${RESCUE_PUBLIC_URL:}

# ---- AI (Claude). Leave the key empty to use offline rule-based triage only. -----------------
rescue.ai.api-key=${ANTHROPIC_API_KEY:}
rescue.ai.model=${RESCUE_AI_MODEL:claude-haiku-5-5}
rescue.ai.base-url=${RESCUE_AI_BASE_URL:}
rescue.ai.timeout-seconds=${RESCUE_AI_TIMEOUT_SECONDS:20}

# ---- SMS (Twilio). Leave empty to disable SMS alerts. -------------------------------------
rescue.sms.twilio-sid=${TWILIO_ACCOUNT_SID:}
rescue.sms.twilio-token=${TWILIO_AUTH_TOKEN:}
rescue.sms.from=${TWILIO_FROM_NUMBER:}
rescue.sms.base-url=${TWILIO_BASE_URL:}

# ---- Push (Firebase Cloud Messaging). Paste the whole service-account JSON key. ------------
rescue.firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
rescue.firebase.base-url=${FIREBASE_BASE_URL:}
